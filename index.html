<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mini-Jeux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#CDEBFB;
    --bg-2:#4C93C7;
    --panel:#F4FAFF;
    --ink:#1C3A52;
    --wood-1:#2E6690;
    --wood-2:#153650;
    --teal:#2C8C7E;
    --teal-dark:#1F6B60;
    --coral:#F0562E;
    --coral-dark:#C7411E;
    --gold:#F4B93E;
    --mat-a:#EAF5FC;
    --mat-b:#D3E9F8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html, body{
    overscroll-behavior:contain;
    height:100%;
    margin:0;
  }
  body{
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.35), transparent 40%),
      linear-gradient(160deg,var(--bg-1) 0%,var(--bg-2) 100%);
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  h1,h2{ font-family:'Fredoka',sans-serif; margin:0; }
  button{ font-family:'Fredoka',sans-serif; cursor:pointer; border:none; }

  .screen{ display:none; }
  .screen.active{ display:flex; }

  /* ---------- HOME SCREEN ---------- */
  #screenHome{
    position:fixed; inset:0 0 0 0; top:0; left:0; right:0; bottom:0;
    flex-direction:column;
    align-items:center;
    padding:20px 16px;
    overflow:hidden;
  }
  #fullscreenBtnHome{
    position:absolute;
    top:max(16px, env(safe-area-inset-top));
    right:16px;
    z-index:5;
  }
  #homeHeader{
    flex:0 0 auto;
    text-align:center;
    margin-bottom:10px;
  }
  #homeHeader h1{
    font-size:clamp(28px,5vw,42px);
    color:var(--wood-2);
    text-shadow:2px 3px 0 rgba(255,255,255,0.5);
  }
  #homeHeader p{
    margin:4px 0 0;
    font-weight:700;
    opacity:0.75;
    font-size:14px;
  }
  #gameGrid{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    max-width:1100px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    grid-auto-rows:1fr;
    gap:12px;
    overflow:hidden;
    padding:6px;
  }
  .game-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    border-radius:20px;
    color:white;
    font-weight:700;
    font-size:clamp(15px,2.6vmin,22px);
    text-align:center;
    padding:8px;
    box-shadow:0 6px 0 rgba(0,0,0,0.18);
    transition:transform .08s ease;
  }
  .game-card:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.18); }
  .game-card .ic{ font-size:clamp(42px,7vmin,68px); }

  /* ---------- GAME SCREEN SHELL ---------- */
  #screenGame.active{
    position:fixed; top:0; left:0; right:0; bottom:0;
    flex-direction:column;
    z-index:10;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.35), transparent 40%),
      linear-gradient(160deg,var(--bg-1) 0%,var(--bg-2) 100%);
  }
  .topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:max(14px, env(safe-area-inset-top)) 70px 4px;
  }
  .topbar .tb-title{
    font-weight:700;
    font-size:clamp(16px,3vw,24px);
    color:var(--wood-2);
    text-align:center;
  }
  .topbar-right{ display:flex; gap:6px; }

  .controlbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:6px 16px 10px;
  }
  .diff-group{
    display:flex;
    align-items:center;
    gap:8px;
    flex:1;
    justify-content:center;
    min-width:0;
  }
  .diffbar-label{
    font-weight:700;
    font-size:15px;
    white-space:nowrap;
  }
  .diffbar-value{
    font-weight:700;
    font-size:14px;
    color:white;
    background:var(--teal);
    border-radius:10px;
    padding:2px 10px;
    min-width:22px;
    text-align:center;
  }
  /* Custom slider (no native <input type=range>, avoids the iOS fullscreen
     "text input" security prompt some Safari versions show for form controls) */
  .cslider{ width:min(200px, 34vw); padding:14px 0; touch-action:none; cursor:pointer; }
  .cslider-track{ position:relative; height:6px; border-radius:4px; background:rgba(21,54,80,0.2); }
  .cslider-fill{ position:absolute; top:0; left:0; height:100%; border-radius:4px; background:var(--coral); }
  .cslider-tick{ position:absolute; top:50%; width:4px; height:4px; margin-left:-2px; margin-top:-2px; border-radius:50%; background:rgba(21,54,80,0.35); }
  .cslider-thumb{
    position:absolute; top:50%; width:26px; height:26px; margin-left:-13px; margin-top:-13px;
    border-radius:50%; background:var(--coral); box-shadow:0 3px 0 var(--coral-dark);
  }
  .tb-btn{
    border-radius:14px;
    padding:9px 14px;
    font-size:14px;
    font-weight:600;
    color:white;
    background:var(--teal);
    box-shadow:0 4px 0 var(--teal-dark);
  }
  .tb-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--teal-dark); }
  .tb-btn.ghost{ background:var(--panel); color:var(--wood-2); box-shadow:0 4px 0 rgba(21,54,80,0.3); }
  .tb-btn.ghost:active{ box-shadow:0 1px 0 rgba(21,54,80,0.3); }
  .tb-btn.icon{ padding:9px 12px; font-size:16px; line-height:1; }
  .tb-btn.hidden{ display:none; }

  #gameArea{
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 14px 14px;
  }
  .game-root{
    width:100%; height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:10px;
  }
  .game-instructions{
    flex:0 0 auto;
    font-weight:700;
    font-size:clamp(13px,2.2vw,17px);
    color:var(--wood-2);
    text-align:center;
    background:rgba(255,255,255,0.55);
    padding:6px 16px;
    border-radius:14px;
  }
  .game-stage{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    max-width:1100px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---------- shared toast ---------- */
  #toast{
    position:fixed;
    left:50%; top:14px;
    transform:translateX(-50%) scale(0.85);
    opacity:0;
    background:var(--gold);
    color:var(--wood-2);
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(16px,3vw,22px);
    padding:12px 24px;
    border-radius:18px;
    box-shadow:0 6px 0 #C98F1F;
    z-index:999;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) scale(1); }

  /* ---------- generic shape helpers ---------- */
  .shp{ display:inline-block; }
  .shp-circle{ border-radius:50%; }
  .shp-square{ border-radius:8px; }
  .shp-triangle{ clip-path:polygon(50% 0%,0% 100%,100% 100%); }
  .shp-diamond{ clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%); }
  .shp-hexagon{ clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%); }
  .shp-star{ clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); }

  /* ================= MEMORY ================= */
  #memGrid{
    display:grid; gap:8px;
    width:100%; height:100%;
  }
  .mem-card{
    border-radius:14px;
    background:linear-gradient(155deg,var(--wood-1),var(--wood-2));
    box-shadow:0 4px 0 rgba(0,0,0,0.2);
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(34px,11vmin,84px);
    transition:transform .25s;
    transform-style:preserve-3d;
  }
  .mem-card .face{ display:none; }
  .mem-card.flipped .face-front, .mem-card.matched .face-front{ display:none; }
  .mem-card.flipped .face-back, .mem-card.matched .face-back{ display:flex; }
  .mem-card:not(.flipped):not(.matched) .face-front{ display:flex; }
  .face{ width:100%; height:100%; align-items:center; justify-content:center; }
  .face-front{ color:rgba(255,255,255,0.65); font-size:clamp(24px,6vmin,42px); }
  .mem-card.matched{ background:rgba(255,255,255,0.5); box-shadow:0 0 0 3px var(--teal) inset; }

  /* ================= SHAPE SORTER ================= */
  #shapeStage{ display:flex; flex-direction:column; gap:26px; width:100%; height:100%; align-items:center; justify-content:center; }
  #shapeSlots{ display:flex; gap:20px; flex-wrap:wrap; align-items:center; justify-content:center; }
  .shape-slot{
    width:clamp(90px,18vmin,150px); height:clamp(90px,18vmin,150px);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    font-size:clamp(46px,11vmin,80px);
  }
  .slot-hint{ filter:brightness(0); opacity:0.88; pointer-events:none; }
  .shape-slot[data-filled] .slot-hint{ display:none; }
  #shapeTray{ display:flex; gap:20px; flex-wrap:wrap; align-items:center; justify-content:center; }
  .shape-piece{
    width:clamp(90px,18vmin,150px); height:clamp(90px,18vmin,150px);
    display:flex; align-items:center; justify-content:center;
    touch-action:none;
    cursor:grab;
    font-size:clamp(46px,11vmin,80px);
  }

  /* ================= BUBBLES ================= */
  #bubbleStage{ position:relative; width:100%; height:100%; }
  .bubble{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.55);
    box-shadow:0 4px 10px rgba(0,0,0,0.15), inset 0 -4px 8px rgba(255,255,255,0.6);
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(28px,7vmin,52px);
    touch-action:none;
    transition:transform .15s ease, opacity .15s ease;
  }
  .bubble.pop{ transform:scale(1.6); opacity:0; }

  /* ================= COUNT ================= */
  #countRow{ display:flex; gap:16px; flex-wrap:wrap; align-items:center; justify-content:center; font-size:clamp(46px,13vmin,96px); }
  #countChoices{ display:flex; gap:16px; }
  .count-btn{
    width:clamp(90px,17vmin,150px); height:clamp(90px,17vmin,150px);
    border-radius:22px;
    background:var(--coral);
    color:white;
    font-size:clamp(36px,9vmin,58px);
    font-weight:700;
    box-shadow:0 6px 0 var(--coral-dark);
  }
  .count-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--coral-dark); }

  /* ================= COLORING ================= */
  #colorStage{ display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; height:100%; justify-content:center; }
  #colorSvgWrap{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; }
  #colorSvgWrap svg{ max-width:100%; max-height:100%; }
  #colorSvgWrap path, #colorSvgWrap ellipse, #colorSvgWrap circle, #colorSvgWrap polygon, #colorSvgWrap rect{
    cursor:pointer;
    stroke:#22303c; stroke-width:3;
  }
  #palette{ display:flex; gap:10px; flex:0 0 auto; flex-wrap:wrap; justify-content:center; }
  .swatch{
    width:clamp(46px,8vmin,60px); height:clamp(46px,8vmin,60px);
    border-radius:50%;
    box-shadow:0 3px 0 rgba(0,0,0,0.2);
    border:3px solid white;
  }
  .swatch.selected{ box-shadow:0 0 0 3px var(--wood-2), 0 3px 0 rgba(0,0,0,0.2); }

  /* ================= ANIMAL SOUNDS ================= */
  #animalGrid{ display:grid; gap:14px; width:100%; height:100%; }
  .animal-btn{
    border-radius:20px;
    background:var(--panel);
    box-shadow:0 5px 0 rgba(21,54,80,0.25);
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(46px,13vmin,108px);
  }
  .animal-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(21,54,80,0.25); }
  .animal-btn.bounce{ animation:abounce .5s ease; }
  @keyframes abounce{ 0%,100%{transform:scale(1);} 40%{transform:scale(1.25);} }
  .animal-btn.placed-correct-anim{ box-shadow:0 0 0 4px var(--teal), 0 5px 0 rgba(21,54,80,0.25); }

  #findStage{ display:flex; flex-direction:column; gap:16px; width:100%; height:100%; align-items:center; justify-content:center; }
  #findPlayRow{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; }
  #findPlayBtn{
    padding:20px 34px;
    border-radius:22px;
    background:var(--coral);
    color:white;
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(20px,5vmin,32px);
    box-shadow:0 7px 0 var(--coral-dark);
  }
  #findPlayBtn:active{ transform:translateY(5px); box-shadow:0 2px 0 var(--coral-dark); }
  #findNewRoundBtn{
    padding:14px 18px;
    border-radius:16px;
    background:var(--teal);
    color:white;
    font-size:clamp(18px,4vmin,26px);
    box-shadow:0 5px 0 var(--teal-dark);
  }
  #findNewRoundBtn:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--teal-dark); }
  #findTargetLabel{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(22px,5vmin,38px);
    color:var(--wood-2);
    background:rgba(255,255,255,0.6);
    padding:8px 22px;
    border-radius:16px;
  }
  #findStage #animalGrid{ flex:1 1 auto; min-height:0; }

  /* ================= COLOR HUNT ================= */
  #colorHuntTarget{ font-size:clamp(90px,24vmin,190px); }
  #colorHuntOptions{ display:flex; gap:18px; flex-wrap:wrap; justify-content:center; }
  .ch-opt{
    width:clamp(100px,19vmin,160px); height:clamp(100px,19vmin,160px);
    border-radius:22px;
    background:var(--panel);
    box-shadow:0 6px 0 rgba(21,54,80,0.25);
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(42px,11vmin,74px);
  }
  .ch-opt:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(21,54,80,0.25); }

  /* ================= SHADOWS ================= */
  #shadowTargetWrap{ font-size:clamp(84px,21vmin,160px); }
  #shadowOptions{ display:flex; gap:18px; }
  .shadow-opt{
    font-size:clamp(72px,18vmin,130px);
    filter:brightness(0);
    opacity:0.85;
  }
  .shadow-opt-wrap{
    width:clamp(108px,24vmin,180px); height:clamp(108px,24vmin,180px);
    border-radius:22px;
    background:var(--panel);
    box-shadow:0 6px 0 rgba(21,54,80,0.25);
    display:flex; align-items:center; justify-content:center;
  }
  .shadow-opt-wrap:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(21,54,80,0.25); }

  /* ================= PAIRS (mixed grid + found panel) ================= */
  #pairStage{
    display:flex;
    gap:14px;
    width:100%; height:100%;
    align-items:stretch;
  }
  #pairFound{
    flex:0 0 auto;
    width:clamp(70px,14vmin,110px);
    max-height:100%;
    overflow:hidden;
    background:rgba(255,255,255,0.5);
    border:3px dashed rgba(21,54,80,0.3);
    border-radius:14px;
    padding:8px 6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .pair-found-label{
    font-weight:700;
    font-size:11px;
    color:var(--wood-2);
    text-align:center;
  }
  .pair-found-item{
    font-size:clamp(20px,4.5vmin,32px);
    opacity:0.85;
  }
  #pairGrid{
    flex:1 1 auto;
    min-width:0;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-content:center;
    justify-content:center;
  }
  .pair-tile{
    border-radius:16px;
    background:var(--panel);
    box-shadow:0 5px 0 rgba(21,54,80,0.25);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
  }
  .pair-tile:active{ transform:translateY(3px); }
  .pair-tile.selected{ box-shadow:0 0 0 4px var(--coral), 0 5px 0 rgba(21,54,80,0.25); }
  .pair-tile.matched{ box-shadow:0 0 0 4px var(--teal), 0 5px 0 rgba(21,54,80,0.25); }
  .pair-tile.fading{ opacity:0; transform:scale(0.6); transition:opacity .2s ease, transform .2s ease; }
  .pair-tile.shake{ animation:shake .3s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  /* ================= DRESS UP ================= */
  #dressStage{ position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  #dressCanvas{ position:relative; flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
  #dressCanvas svg{ display:block; }
  #dressStickers{ display:flex; gap:16px; flex:0 0 auto; flex-wrap:wrap; justify-content:center; min-height:clamp(64px,14vmin,96px); align-items:center; }
  .sticker{
    font-size:clamp(46px,11vmin,72px);
    cursor:grab;
    touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    background:rgba(255,255,255,0.5);
    border-radius:14px;
    padding:8px;
  }
  .sticker:active{ transform:scale(0.9); }

  /* ================= SORT (fruits/veg) ================= */
  #sortStage{ display:flex; flex-direction:column; gap:28px; width:100%; height:100%; align-items:center; justify-content:center; }
  #sortBaskets{ display:flex; gap:40px; }
  .basket{
    width:clamp(140px,26vmin,220px); height:clamp(110px,20vmin,175px);
    border-radius:20px 20px 30px 30px;
    background:rgba(255,255,255,0.5);
    border:4px dashed rgba(21,54,80,0.35);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:clamp(15px,3vmin,20px);
    font-weight:700;
    gap:6px;
  }
  .basket .ic{ font-size:clamp(42px,9vmin,68px); }
  #sortTray{ display:flex; gap:18px; flex-wrap:wrap; justify-content:center; }
  .sort-item{
    font-size:clamp(50px,12vmin,84px);
    touch-action:none;
    cursor:grab;
  }
  .sort-item.gone{ visibility:hidden; }

  footer.credit{ display:none; }

  /* ================= PUZZLE (12th game) ================= */
  .pz-chooser{
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .pz-chooser-btn{
    border-radius:18px;
    padding:18px 30px;
    font-size:clamp(16px,3vmin,22px);
    font-weight:600;
    color:white;
    background:var(--teal);
    box-shadow:0 6px 0 var(--teal-dark);
  }
  .pz-chooser-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--teal-dark); }
  #pzFileInput{ display:none; }
  .pz-play-area{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    align-items:center;
    justify-content:center;
    width:100%; height:100%;
  }
  @media (min-width:701px), (orientation:landscape){
    .pz-play-area{ flex-wrap:nowrap !important; }
  }
  .pz-frame-outer{
    flex:0 0 auto;
    background:linear-gradient(155deg,var(--wood-1),var(--wood-2));
    border-radius:10px;
    padding:12px;
    box-shadow:0 10px 0 rgba(0,0,0,0.18), inset 0 0 0 2px rgba(255,255,255,0.08);
  }
  .pz-frame{
    position:relative;
    background:repeating-conic-gradient(var(--mat-a) 0% 25%,var(--mat-b) 0% 50%) 50% / 24px 24px;
    border-radius:3px;
    box-shadow:inset 0 0 0 4px rgba(255,255,255,0.55), inset 0 2px 6px rgba(0,0,0,0.15);
    overflow:visible;
  }
  .pz-watermark{ position:absolute; top:0; left:0; opacity:0.28; pointer-events:none; z-index:0; -webkit-user-select:none; user-select:none; }
  .pz-slot{ position:absolute; border:2px dashed rgba(21,54,80,0.28); box-sizing:border-box; pointer-events:none; z-index:1; }
  .pz-tray-wrap{
    flex:0 0 auto;
    width:clamp(160px,20vmin,260px);
    background:rgba(255,252,245,0.6);
    border:3px dashed rgba(21,54,80,0.3);
    border-radius:12px;
    padding:10px;
    display:flex; flex-direction:column;
    max-height:100%;
  }
  .pz-tray-label{ flex:0 0 auto; font-weight:700; font-size:12px; color:var(--wood-2); text-align:center; margin-bottom:6px; }
  .pz-tray{
    flex:1 1 auto; min-height:0; overflow:hidden;
    display:flex; flex-wrap:wrap; gap:6px; align-content:center; justify-content:center;
  }
  @media (max-width:700px) and (orientation:portrait){
    .pz-tray-wrap{ height:150px !important; max-width:none; width:100%; }
  }
  .pz-piece{
    cursor:grab; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,0.3));
    z-index:5;
  }
  .pz-piece.in-frame{ position:absolute; z-index:2; }
  .pz-piece.dragging{ cursor:grabbing; z-index:999; }
  .pz-piece.placed-correct{ filter:drop-shadow(0 0 0 3px var(--teal)) drop-shadow(0 3px 4px rgba(0,0,0,0.3)); }
</style>
</head>
<body>

<div id="screenHome" class="screen active">
  <button class="tb-btn icon ghost" id="fullscreenBtnHome" title="Plein écran">⛶</button>
  <div id="homeHeader">
    <h1>🎮 Mini-Jeux</h1>
    <p>Touche un jeu pour commencer !</p>
  </div>
  <div id="gameGrid"></div>
</div>

<div id="screenGame" class="screen">
  <div class="topbar">
    <span class="tb-title" id="gameTitle">Jeu</span>
  </div>
  <div class="controlbar">
    <div class="diff-group">
      <span class="diffbar-label">🎚️</span>
      <div class="cslider" id="diffSlider">
        <div class="cslider-track">
          <div class="cslider-fill" id="diffFill"></div>
          <div class="cslider-tick" style="left:0%"></div>
          <div class="cslider-tick" style="left:25%"></div>
          <div class="cslider-tick" style="left:50%"></div>
          <div class="cslider-tick" style="left:75%"></div>
          <div class="cslider-tick" style="left:100%"></div>
          <div class="cslider-thumb" id="diffThumb"></div>
        </div>
      </div>
      <span class="diffbar-value" id="diffValue">2</span>
    </div>
    <div class="topbar-right">
      <button class="tb-btn" id="newBtn">🔀 Nouveau</button>
      <button class="tb-btn icon ghost" id="fullscreenBtn" title="Plein écran">⛶</button>
      <button class="tb-btn ghost" id="backBtn">← Accueil</button>
    </div>
  </div>
  <div id="gameArea"></div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  /* ============================================================
     SHARED SHELL: navigation, fullscreen, toast, sound, speech
     ============================================================ */

  const screenHome = document.getElementById('screenHome');
  const screenGame = document.getElementById('screenGame');
  const gameGrid = document.getElementById('gameGrid');
  const gameArea = document.getElementById('gameArea');
  const gameTitle = document.getElementById('gameTitle');
  const backBtn = document.getElementById('backBtn');
  const newBtn = document.getElementById('newBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const toast = document.getElementById('toast');

  let currentGame = null;

  function showToast(msg, ms){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toast.classList.remove('show'), ms||1400);
  }

  // ---- tiny synthesized sound effects (no audio files needed) ----
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, dur, type){
    try{
      const ctx = ensureAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type||'sine';
      osc.frequency.value = freq;
      const t0 = ctx.currentTime;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.35, t0+0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur||0.2));
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + (dur||0.2) + 0.03);
    }catch(err){ /* ignore */ }
  }
  function soundPop(){ beep(700,0.1,'triangle'); setTimeout(()=>beep(950,0.09,'triangle'),35); }
  function soundGood(){ beep(660,0.12,'sine'); setTimeout(()=>beep(880,0.18,'sine'),110); }
  function soundOops(){ beep(180,0.18,'sawtooth'); }

  // ---- synthesized animal cries (no audio files, no onomatopoeia text) ----
  function playCrySound(kind){
    try{
      const ctx = ensureAudio();
      const t0 = ctx.currentTime;
      function tone(f1, f2, dur, type, offset, vol){
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f1, t0+offset);
        osc.frequency.linearRampToValueAtTime(f2, t0+offset+dur);
        gain.gain.setValueAtTime(0.0001, t0+offset);
        gain.gain.exponentialRampToValueAtTime(vol||0.3, t0+offset+0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0+offset+dur);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t0+offset); osc.stop(t0+offset+dur+0.05);
      }
      switch(kind){
        case 'dog': tone(320,220,0.12,'sawtooth',0,0.3); tone(320,220,0.12,'sawtooth',0.17,0.3); break;
        case 'cat': tone(420,750,0.16,'sine',0,0.28); tone(750,430,0.18,'sine',0.17,0.24); break;
        case 'cow': tone(95,120,0.55,'sawtooth',0,0.32); break;
        case 'sheep': tone(320,380,0.14,'sawtooth',0,0.28); tone(320,270,0.16,'sawtooth',0.17,0.26); break;
        case 'duck': tone(520,470,0.09,'square',0,0.22); tone(520,470,0.09,'square',0.14,0.22); break;
        case 'horse': tone(220,520,0.25,'sawtooth',0,0.3); tone(500,320,0.22,'sawtooth',0.26,0.24); break;
        case 'pig': tone(160,120,0.1,'sawtooth',0,0.28); tone(160,120,0.1,'sawtooth',0.13,0.28); tone(160,105,0.14,'sawtooth',0.27,0.28); break;
        case 'frog': tone(220,150,0.12,'sawtooth',0,0.28); break;
        case 'rooster': tone(400,700,0.12,'sawtooth',0,0.3); tone(700,850,0.1,'sawtooth',0.13,0.28); tone(850,500,0.18,'sawtooth',0.24,0.24); break;
        case 'roar': tone(70,95,0.5,'sawtooth',0,0.35); break;
      }
    }catch(err){ /* ignore */ }
  }

  function warmUpAudio(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
    }catch(err){}
    if('speechSynthesis' in window){
      try{
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        window.speechSynthesis.speak(u);
      }catch(err){}
    }
  }

  function say(text){
    if(!('speechSynthesis' in window)) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'fr-FR';
      u.rate = 0.95;
      u.pitch = 1.1;
      window.speechSynthesis.speak(u);
    }catch(err){}
  }

  const BRAVOS = [
    'Bravo !','Super !','Génial !','Trop bien !','Bien joué !','Youpi !',
    'Bravo, Paul ! Tu es un champion !',
    'Super ! Paul, tu es trop fort !',
    'Ouah ! Bravo, mon baboun !',
    'Excellent, ti bouchon !',
    'Ah ! Il gère, le bidouk !',
    'C\'est gagné, Monsieur Paul !',
    'Ça, c\'est parfait, bouchon tout rond !'
  ];
  function celebrate(){
    soundGood();
    const phrase = BRAVOS[Math.floor(Math.random()*BRAVOS.length)];
    say(phrase);
    showToast('🎉 ' + phrase, 1200);
  }

  // ---- fullscreen ----
  const fullscreenBtnHome = document.getElementById('fullscreenBtnHome');
  function fsElement(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }
  function requestFs(el){ const fn = el.requestFullscreen || el.webkitRequestFullscreen; if(fn) return fn.call(el); }
  function exitFs(){ const fn = document.exitFullscreen || document.webkitExitFullscreen; if(fn) return fn.call(document); }
  const fsSupported = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  if(!fsSupported){ fullscreenBtn.classList.add('hidden'); fullscreenBtnHome.classList.add('hidden'); }
  function updateFsBtn(){
    const icon = fsElement() ? '⤢' : '⛶';
    fullscreenBtn.textContent = icon;
    fullscreenBtnHome.textContent = icon;
  }
  function toggleFullscreen(){
    try{ if(fsElement()) exitFs(); else requestFs(document.documentElement); }catch(err){}
  }
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  fullscreenBtnHome.addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', updateFsBtn);
  document.addEventListener('webkitfullscreenchange', updateFsBtn);

  // ---- navigation ----
  let activeCleanup = null;

  function teardown(){
    if(typeof activeCleanup === 'function'){
      try{ activeCleanup(); }catch(err){}
    }
    activeCleanup = null;
    gameArea.innerHTML = '';
  }

  function openGame(game){
    currentGame = game;
    gameTitle.textContent = game.icon + ' ' + game.title;
    screenHome.classList.remove('active');
    screenGame.classList.add('active');
    syncDiffSliderToCurrentGame();
    warmUpAudio();
    teardown();
    requestAnimationFrame(()=>{ activeCleanup = game.init(gameArea) || null; });
  }
  backBtn.addEventListener('click', ()=>{
    if(fsElement()) exitFs();
    teardown();
    screenGame.classList.remove('active');
    screenHome.classList.add('active');
    currentGame = null;
  });
  newBtn.addEventListener('click', ()=>{
    if(currentGame){
      teardown();
      activeCleanup = currentGame.init(gameArea) || null;
    }
  });

  function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function pickN(arr, n){ return shuffle(arr).slice(0, n); }
  function gridDims(n){
    let cols = Math.ceil(Math.sqrt(n));
    while(n % cols !== 0 && cols < n) cols++;
    return { cols, rows: Math.ceil(n/cols) };
  }

  // ---- per-game difficulty (1..5) — each game remembers its own level ----
  const gameDifficultyById = {};
  function curDifficulty(){
    if(!currentGame) return 2;
    if(gameDifficultyById[currentGame.id] === undefined) gameDifficultyById[currentGame.id] = 2;
    return gameDifficultyById[currentGame.id];
  }
  function diffN(lo, hi){
    const t = (curDifficulty()-1)/4;
    return Math.round(lo + (hi-lo)*t);
  }
  const diffSlider = document.getElementById('diffSlider');
  const diffTrack = diffSlider.querySelector('.cslider-track');
  const diffThumb = document.getElementById('diffThumb');
  const diffFill = document.getElementById('diffFill');
  const diffValue = document.getElementById('diffValue');

  function setDiffVisual(v){
    const pct = ((v-1)/4)*100;
    diffThumb.style.left = pct+'%';
    diffFill.style.width = pct+'%';
    diffValue.textContent = v;
  }
  function syncDiffSliderToCurrentGame(){
    setDiffVisual(curDifficulty());
  }
  function commitDiff(v){
    if(!currentGame) return;
    v = Math.max(1, Math.min(5, v));
    if(gameDifficultyById[currentGame.id] === v) return;
    gameDifficultyById[currentGame.id] = v;
    setDiffVisual(v);
    teardown();
    activeCleanup = currentGame.init(gameArea) || null;
  }
  function diffValueFromClientX(clientX){
    const r = diffTrack.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (clientX-r.left)/r.width));
    return Math.round(pct*4)+1;
  }
  let diffDragging = false;
  function diffDown(clientX){ diffDragging = true; commitDiff(diffValueFromClientX(clientX)); }
  function diffMove(clientX){ if(diffDragging) commitDiff(diffValueFromClientX(clientX)); }
  function diffUp(){ diffDragging = false; }
  diffSlider.addEventListener('mousedown', (e)=>{ diffDown(e.clientX); e.preventDefault(); });
  diffSlider.addEventListener('touchstart', (e)=>{ diffDown(e.touches[0].clientX); if(e.cancelable) e.preventDefault(); }, {passive:false});
  window.addEventListener('mousemove', (e)=> diffMove(e.clientX));
  window.addEventListener('touchmove', (e)=>{ if(diffDragging){ diffMove(e.touches[0].clientX); if(e.cancelable) e.preventDefault(); } }, {passive:false});
  window.addEventListener('mouseup', diffUp);
  window.addEventListener('touchend', diffUp);

  /* ============================================================
     Generic drag helper: makes an element draggable (mouse+touch),
     calling onDrop(x,y) with the pointer's final page coordinates.
     ============================================================ */
  function makeSimpleDraggable(el, opts){
    opts = opts || {};
    let dragging = false, startParent = null, startNext = null, offsetX=0, offsetY=0;

    function down(clientX, clientY){
      dragging = true;
      const rect0 = el.getBoundingClientRect();
      startParent = el.parentElement;
      startNext = el.nextSibling;
      el.style.width = rect0.width+'px';
      el.style.height = rect0.height+'px';
      el.style.position = 'fixed';
      el.style.left = rect0.left+'px';
      el.style.top = rect0.top+'px';
      el.style.zIndex = 999;
      document.body.appendChild(el);
      if(opts.onPick) opts.onPick(); // may resize el (e.g. grow to full size)
      const rect = el.getBoundingClientRect();
      offsetX = rect.width/2;
      offsetY = rect.height/2;
      el.style.left = (clientX-offsetX)+'px';
      el.style.top = (clientY-offsetY)+'px';
    }
    function move(clientX, clientY){
      if(!dragging) return;
      el.style.left = (clientX-offsetX)+'px';
      el.style.top = (clientY-offsetY)+'px';
    }
    function up(clientX, clientY){
      if(!dragging) return;
      dragging = false;
      const rect = el.getBoundingClientRect();
      const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
      const handled = opts.onDrop ? opts.onDrop(cx, cy, el) : false;
      if(!handled){
        el.style.position = 'static';
        el.style.left = ''; el.style.top = ''; el.style.width=''; el.style.height=''; el.style.zIndex='';
        if(startNext) startParent.insertBefore(el, startNext); else startParent.appendChild(el);
      }
    }
    el.addEventListener('mousedown', (e)=>{ down(e.clientX,e.clientY); e.preventDefault(); });
    el.addEventListener('touchstart', (e)=>{ const t=e.touches[0]; down(t.clientX,t.clientY); if(e.cancelable) e.preventDefault(); }, {passive:false});
    window.addEventListener('mousemove', (e)=> move(e.clientX,e.clientY));
    window.addEventListener('touchmove', (e)=>{ const t=e.touches[0]; move(t.clientX,t.clientY); if(e.cancelable) e.preventDefault(); }, {passive:false});
    window.addEventListener('mouseup', (e)=> up(e.clientX,e.clientY));
    window.addEventListener('touchend', (e)=>{ const t=e.changedTouches[0]; up(t.clientX,t.clientY); });
    window.addEventListener('touchcancel', (e)=>{ const t=e.changedTouches[0]; up(t.clientX,t.clientY); });
  }

  /* ============================================================
     CONTENT SETS (emoji-based, no external assets, no copyright)
     ============================================================ */
  const SETS = {
    animaux: ['🐶','🐱','🐭','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐷','🐸'],
    ferme:   ['🐄','🐷','🐑','🐔','🐴','🐐','🐓','🦆','🐇','🐕'],
    jungle:  ['🦁','🐯','🐵','🐘','🦒','🦓','🐍','🦜','🐊','🦍'],
    ocean:   ['🐳','🐬','🐠','🐡','🦀','🐙','🦑','🦈','🐢','🦞'],
    fruits:  ['🍎','🍌','🍇','🍓','🍊','🍉','🍍','🍑','🍒','🥝','🍋','🍐'],
    legumes: ['🥕','🥦','🌽','🍅','🥔','🥒','🍆','🫑','🧅','🥬'],
    vehicules: ['🚗','🚕','🚌','🚓','🚑','🚒','🚜','✈️','🚀','⛵','🚲','🚂'],
    jouets:  ['🧸','🎈','🪀','🪁','🎲','🧩','🪅','🎯']
  };

  const COLORS = [
    {name:'rouge', hex:'#E5473B'},
    {name:'bleu', hex:'#3B7DE5'},
    {name:'jaune', hex:'#F2C230'},
    {name:'vert', hex:'#3EA35C'},
    {name:'orange', hex:'#F0872E'},
    {name:'violet', hex:'#8B5FBF'},
    {name:'rose', hex:'#EE6FA6'}
  ];

  /* ============================================================
     GAME 1 — MEMORY (several themes, adjustable pair count)
     ============================================================ */
  const gameMemory = {
    id:'memory', icon:'🧠', title:'Mémo', color:'#4C93C7', desc:'Retrouve les paires',
    init(root){
      const wrap = document.createElement('div');
      wrap.className = 'game-root';
      const instr = document.createElement('div');
      instr.className = 'game-instructions';
      instr.textContent = 'Retourne deux cartes pour trouver les paires !';
      const stage = document.createElement('div');
      stage.className = 'game-stage';
      const grid = document.createElement('div');
      grid.id = 'memGrid';
      stage.appendChild(grid);
      wrap.appendChild(instr); wrap.appendChild(stage);
      root.appendChild(wrap);

      const themeKey = rand(['animaux','ferme','jungle','ocean','fruits','vehicules','jouets']);
      const pairCount = diffN(3,8);
      const chosen = pickN(SETS[themeKey], pairCount);
      let cards = shuffle(chosen.concat(chosen)).map((emoji,i)=>({emoji, id:i}));

      const {cols, rows} = gridDims(cards.length);
      grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;
      grid.style.gridTemplateRows = `repeat(${rows},1fr)`;

      let first = null, second = null, lock = false, matchedCount = 0;

      cards.forEach(card=>{
        const el = document.createElement('div');
        el.className = 'mem-card';
        el.innerHTML = `<div class="face face-front">❓</div><div class="face face-back">${card.emoji}</div>`;
        el.addEventListener('click', ()=>{
          if(lock || el.classList.contains('flipped') || el.classList.contains('matched')) return;
          el.classList.add('flipped');
          soundPop();
          if(!first){ first = {el, card}; return; }
          second = {el, card};
          lock = true;
          if(first.card.emoji === second.card.emoji){
            first.el.classList.add('matched');
            second.el.classList.add('matched');
            matchedCount += 2;
            first=null; second=null; lock=false;
            if(matchedCount === cards.length){ setTimeout(celebrate, 200); }
          } else {
            setTimeout(()=>{
              first.el.classList.remove('flipped');
              second.el.classList.remove('flipped');
              first=null; second=null; lock=false;
            }, 700);
          }
        });
        grid.appendChild(el);
      });
    }
  };

  /* ============================================================
     GAME 2 — SHAPE / OBJECT SORTER
     ============================================================ */
  const SHAPE_SETS = [
    ['⚪','⬜','🔺','⭐','❤️','🔷','🟢','🟪'],
    ['🍊','🎁','🍕','💎','🍉','🔶','🍪','📦'],
    ['⚽','🚩','🍩','🧩','🎈','🪁','🎲','🍫']
  ];

  const gameShapes = {
    id:'shapes', icon:'🔷', title:'Formes', color:'#8B5FBF', desc:'Range les formes dans leur trou',
    init(root){
      const wrap = document.createElement('div');
      wrap.className = 'game-root';
      const instr = document.createElement('div');
      instr.className = 'game-instructions';
      instr.textContent = 'Glisse chaque forme dans son trou !';
      const stage = document.createElement('div');
      stage.id = 'shapeStage';
      const slotsRow = document.createElement('div');
      slotsRow.id = 'shapeSlots';
      const tray = document.createElement('div');
      tray.id = 'shapeTray';
      stage.appendChild(slotsRow); stage.appendChild(tray);
      wrap.appendChild(instr); wrap.appendChild(stage);
      root.appendChild(wrap);

      const n = diffN(3,7);
      const pool = rand(SHAPE_SETS);
      const chosenShapes = pickN(pool, Math.min(n, pool.length));
      const order = shuffle(chosenShapes);

      let placedCount = 0;
      const slotByShape = {};

      chosenShapes.forEach((shape)=>{
        const slot = document.createElement('div');
        slot.className = 'shape-slot';
        slot.dataset.shape = shape;
        const hint = document.createElement('span');
        hint.className = 'slot-hint';
        hint.textContent = shape;
        slot.appendChild(hint);
        slotsRow.appendChild(slot);
        slotByShape[shape] = slot;
      });

      order.forEach((shape)=>{
        const piece = document.createElement('div');
        piece.className = 'shape-piece';
        piece.textContent = shape;
        piece.dataset.shape = shape;
        tray.appendChild(piece);

        makeSimpleDraggable(piece, {
          onDrop(cx, cy){
            const slot = slotByShape[shape];
            if(slot.dataset.filled) return false;
            const r = slot.getBoundingClientRect();
            const overThisSlot = cx>=r.left && cx<=r.right && cy>=r.top && cy<=r.bottom;
            if(overThisSlot){
              // Reparent the piece INTO its slot so it always stays correctly
              // positioned (no viewport-fixed math, no stacking issues).
              piece.style.position = 'absolute';
              piece.style.left = '0'; piece.style.top = '0';
              piece.style.width = '100%'; piece.style.height = '100%';
              piece.style.zIndex = '2';
              slot.appendChild(piece);
              slot.dataset.filled = '1';
              placedCount++;
              soundPop();
              if(placedCount === chosenShapes.length) setTimeout(celebrate, 150);
              return true;
            }
            // Wrong spot: only scold if dropped on ANY slot (not just wandering nearby)
            const anySlot = Array.from(slotsRow.querySelectorAll('.shape-slot')).find(s=>{
              const rr = s.getBoundingClientRect();
              return cx>=rr.left && cx<=rr.right && cy>=rr.top && cy<=rr.bottom;
            });
            if(anySlot) soundOops();
            return false;
          }
        });
      });

      // Force everything to fit on a single row (never wrap), so the shapes
      // can never grow tall enough to overlap the control bar above.
      function fitRowSize(){
        const availW = stage.getBoundingClientRect().width || slotsRow.getBoundingClientRect().width;
        const gap = 20;
        const raw = Math.floor((availW - (n-1)*gap) / n);
        const size = Math.max(46, Math.min(150, raw));
        const fontSize = Math.round(size*0.52);
        [...slotsRow.querySelectorAll('.shape-slot'), ...tray.querySelectorAll('.shape-piece')].forEach(el=>{
          el.style.width = size+'px';
          el.style.height = size+'px';
          el.style.fontSize = fontSize+'px';
        });
      }
      requestAnimationFrame(fitRowSize);
      window.addEventListener('resize', fitRowSize);
      return function cleanup(){ window.removeEventListener('resize', fitRowSize); };
    }
  };

  /* ============================================================
     GAME 3 — BUBBLES
     ============================================================ */
  const gameBubbles = {
    id:'bubbles', icon:'🎈', title:'Bulles', color:'#3EA35C', desc:'Fais éclater les bulles',
    init(root){
      const wrap = document.createElement('div');
      wrap.className = 'game-root';
      const instr = document.createElement('div');
      instr.className = 'game-instructions';
      const stage = document.createElement('div');
      stage.className = 'game-stage';
      const bubbleStage = document.createElement('div');
      bubbleStage.id = 'bubbleStage';
      stage.appendChild(bubbleStage);
      wrap.appendChild(instr); wrap.appendChild(stage);
      root.appendChild(wrap);

      const themeKey = rand(['animaux','fruits','jouets','ferme','ocean']);
      const items = SETS[themeKey];
      const total = diffN(8,20);
      let spawned = 0, popped = 0;
      let stopped = false;
      const timers = [];

      function updateInstr(){
        instr.textContent = `Fais éclater toutes les bulles ! (${popped}/${total})`;
      }
      updateInstr();

      function spawnBubble(){
        if(stopped || !bubbleStage.isConnected || spawned >= total) return;
        const rect = bubbleStage.getBoundingClientRect();
        if(rect.width < 20 || rect.height < 20) return;
        const size = 64 + Math.random()*56;
        const b = document.createElement('div');
        b.className = 'bubble';
        b.textContent = rand(items);
        b.style.width = size+'px';
        b.style.height = size+'px';
        b.style.left = (Math.random()*(rect.width-size))+'px';
        b.style.top = (Math.random()*(rect.height-size))+'px';
        spawned++;
        b.addEventListener('click', ()=>{
          if(b.classList.contains('pop')) return;
          b.classList.add('pop');
          soundPop();
          popped++;
          updateInstr();
          timers.push(setTimeout(()=> b.remove(), 180));
          if(popped >= total) setTimeout(celebrate, 250);
        });
        bubbleStage.appendChild(b);
      }

      const spawnGap = diffN(1300, 550);
      for(let i=0;i<Math.min(6,total);i++) timers.push(setTimeout(spawnBubble, i*180));
      const interval = setInterval(()=>{
        spawnBubble();
        if(spawned >= total) clearInterval(interval);
      }, spawnGap);

      return function cleanup(){
        stopped = true;
        clearInterval(interval);
        timers.forEach(clearTimeout);
      };
    }
  };

            selected = null;
            return;
          }
          if(!selected){
            selected = btn;
            btn.classList.add('selected');
            soundPop();
            return;
          }
          if(selected.dataset.em === btn.dataset.em){
            selected.classList.add('matched'); btn.classList.add('matched');
            selected.classList.add('fading'); btn.classList.add('fading');
            soundPop();
            const gone1 = selected, gone2 = btn;
            selected = null;
            const chip = document.createElement('div');
            chip.className = 'pair-found-item';
            chip.textContent = em;
            foundPanel.appendChild(chip);
            foundCount++;
            setTimeout(()=>{ gone1.remove(); gone2.remove(); }, 220);
            if(foundCount === pairs) setTimeout(celebrate, 300);
          } else {
            soundOops();
            const prev = selected;
            btn.classList.add('shake');
            selected = null;
            setTimeout(()=>{ prev.classList.remove('selected'); btn.classList.remove('shake'); }, 350);
          }
        });
        mainGrid.appendChild(btn);
      });

      function fitPairGrid(){
        const availW = mainGrid.getBoundingClientRect().width;
        const availH = mainGrid.getBoundingClientRect().height;
        const rows = Math.ceil(total/cols);
        const gap = 10;
        const sizeW = (availW - (cols-1)*gap) / cols;
        const sizeH = (availH - (rows-1)*gap) / rows;
        const size = Math.max(36, Math.min(sizeW, sizeH, 130));
        mainGrid.querySelectorAll('.pair-tile').forEach(t=>{
          t.style.width = size+'px';
          t.style.height = size+'px';
          t.style.fontSize = Math.round(size*0.5)+'px';
        });
      }
      requestAnimationFrame(fitPairGrid);
      window.addEventListener('resize', fitPairGrid);
      return function cleanup(){ window.removeEventListener('resize', fitPairGrid); };
    }
  };

  let pzLoadedImg = null; // persists across "Nouveau" so it reshuffles the SAME image

  function pzPt(x1,y1,ux,uy,nx,ny,len,t,off){
    return { x: x1+ux*len*t+nx*off, y: y1+uy*len*t+ny*off };
  }
  function pzDrawEdge(ctx, x1,y1,x2,y2, sign){
    const dx=x2-x1, dy=y2-y1;
    const len=Math.hypot(dx,dy);
    const ux=dx/len, uy=dy/len;
    const nx=uy, ny=-ux;
    if(sign===0){ ctx.lineTo(x2,y2); return; }
    const depth = sign*len*0.24;
    const n1=0.34, n2=0.66;
    const p1 = pzPt(x1,y1,ux,uy,nx,ny,len,n1,0);
    const c1 = pzPt(x1,y1,ux,uy,nx,ny,len,n1,depth*0.7);
    const c2 = pzPt(x1,y1,ux,uy,nx,ny,len,0.42,depth);
    const p3 = pzPt(x1,y1,ux,uy,nx,ny,len,0.5,depth);
    const c3 = pzPt(x1,y1,ux,uy,nx,ny,len,0.58,depth);
    const c4 = pzPt(x1,y1,ux,uy,nx,ny,len,n2,depth*0.7);
    const p5 = pzPt(x1,y1,ux,uy,nx,ny,len,n2,0);
    ctx.lineTo(p1.x,p1.y);
    ctx.bezierCurveTo(c1.x,c1.y, c2.x,c2.y, p3.x,p3.y);
    ctx.bezierCurveTo(c3.x,c3.y, c4.x,c4.y, p5.x,p5.y);
    ctx.lineTo(x2,y2);
  }
  function pzComputeTrayScale(fullW, fullH, totalPieces, trayInnerW, trayInnerH, gap){
    const minScale = 0.16, maxScale = 0.85;
    function fits(scale){
      const w = fullW*scale, h = fullH*scale;
      const perRow = Math.max(1, Math.floor((trayInnerW + gap) / (w + gap)));
      const rowsNeeded = Math.ceil(totalPieces / perRow);
      const neededHeight = rowsNeeded * (h + gap);
      return neededHeight <= trayInnerH + gap && w <= trayInnerW;
    }
    if(fits(maxScale)) return maxScale;
    if(!fits(minScale)) return minScale;
    let lo = minScale, hi = maxScale;
    for(let i=0;i<18;i++){
      const mid = (lo+hi)/2;
      if(fits(mid)) lo = mid; else hi = mid;
    }
    return lo;
  }

          const slot = document.createElement('div');
          slot.className = 'pz-slot';
          slot.style.left=(c*pieceW)+'px'; slot.style.top=(r*pieceH)+'px';
          slot.style.width=pieceW+'px'; slot.style.height=pieceH+'px';
          frame.appendChild(slot);
        }
      }

      const vEdge=[], hEdge=[];
      for(let r=0;r<rows;r++){ vEdge.push([]); for(let c=0;c<cols-1;c++) vEdge[r].push(Math.random()<0.5?1:-1); }
      for(let r=0;r<rows-1;r++){ hEdge.push([]); for(let c=0;c<cols;c++) hEdge[r].push(Math.random()<0.5?1:-1); }

      const fullW = pieceW+padding*2, fullH = pieceH+padding*2;
      const totalPieces = cols*rows;
      const trayInnerW = tray.clientWidth || 180;
      const trayInnerH = tray.clientHeight || 180;
      const trayScale = pzComputeTrayScale(fullW, fullH, totalPieces, trayInnerW, trayInnerH, 6);

      function applyTraySizePz(canvas){
        canvas.style.width = (fullW*trayScale)+'px';
        canvas.style.height = (fullH*trayScale)+'px';
      }
      function applyFullSizePz(canvas){
        canvas.style.width = fullW+'px';
        canvas.style.height = fullH+'px';
      }

      const piecesData = [];
      let placedCount = 0;
      const order = [];
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) order.push({r,c});
      shuffle(order).forEach(({r,c})=>{
        const top    = (r===0)     ? 0 : -hEdge[r-1][c];
        const bottom = (r===rows-1)? 0 :  hEdge[r][c];
        const left   = (c===0)     ? 0 : -vEdge[r][c-1];
        const right  = (c===cols-1)? 0 :  vEdge[r][c];

        const canvas = document.createElement('canvas');
        canvas.className = 'pz-piece';
        canvas.width = fullW; canvas.height = fullH;
        const ctx = canvas.getContext('2d');
        const x0=padding, y0=padding;
        ctx.beginPath(); ctx.moveTo(x0,y0);
        pzDrawEdge(ctx,x0,y0,x0+pieceW,y0,top);
        pzDrawEdge(ctx,x0+pieceW,y0,x0+pieceW,y0+pieceH,right);
        pzDrawEdge(ctx,x0+pieceW,y0+pieceH,x0,y0+pieceH,bottom);
        pzDrawEdge(ctx,x0,y0+pieceH,x0,y0,left);
        ctx.closePath();
        ctx.save(); ctx.clip();
        ctx.drawImage(pzLoadedImg, -(c*pieceW)+padding, -(r*pieceH)+padding, boardW, boardH);
        ctx.restore();
        ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(21,54,80,0.4)'; ctx.stroke();

        canvas.dataset.correctRow=r; canvas.dataset.correctCol=c; canvas.dataset.placed='0';
        tray.appendChild(canvas);
        applyTraySizePz(canvas);
        piecesData.push(canvas);

        makeSimpleDraggable(canvas, {
          onPick(){ applyFullSizePz(canvas); },
          onDrop(cx, cy){
            const frameRect = frame.getBoundingClientRect();
            const inside = cx>=frameRect.left && cx<=frameRect.right && cy>=frameRect.top && cy<=frameRect.bottom;
            if(inside){
              const localX = cx-frameRect.left, localY = cy-frameRect.top;
              let col = Math.max(0, Math.min(cols-1, Math.floor(localX/pieceW)));
              let row = Math.max(0, Math.min(rows-1, Math.floor(localY/pieceH)));
              const occupied = piecesData.some(p=> p!==canvas && p.dataset.placed==='1' &&
                parseInt(p.dataset.placedRow)===row && parseInt(p.dataset.placedCol)===col);
              if(!occupied){
                canvas.style.position='absolute';
                canvas.classList.add('in-frame');
                frame.appendChild(canvas);
                canvas.style.left=(col*pieceW-padding)+'px';
                canvas.style.top=(row*pieceH-padding)+'px';
                canvas.style.width=fullW+'px'; canvas.style.height=fullH+'px';
                canvas.dataset.placed='1'; canvas.dataset.placedRow=row; canvas.dataset.placedCol=col;
                const correct = row===parseInt(canvas.dataset.correctRow) && col===parseInt(canvas.dataset.correctCol);
                canvas.classList.toggle('placed-correct', correct);
                soundPop();
                placedCount++;
                if(piecesData.every(p=>p.dataset.placed==='1') &&
                   piecesData.every(p=> p.dataset.placedRow===p.dataset.correctRow && p.dataset.placedCol===p.dataset.correctCol)){
                  setTimeout(celebrate, 200);
                }
                return true;
              }
            }
            canvas.style.position='static';
            canvas.classList.remove('in-frame');
            canvas.classList.remove('placed-correct');
            canvas.dataset.placed='0';
            tray.appendChild(canvas);
            applyTraySizePz(canvas);
            return true; // we handled repositioning ourselves either way
          }
        });
      });
    }
  };

  /* ============================================================
     REGISTER GAMES + BUILD HOME GRID
     ============================================================ */
  const GAMES = [
    gameMemory, gameShapes, gameBubbles, gameCount, gameColoring,
    gameAnimals, gameFindAnimal, gameColorHunt, gameShadows, gameDots, gameDress, gameSort, gamePuzzle
  ];

  GAMES.forEach(game=>{
    const card = document.createElement('button');
    card.className = 'game-card';
    card.style.background = `linear-gradient(155deg, ${game.color}, #153650)`;
    card.innerHTML = `<span class="ic">${game.icon}</span><span>${game.title}</span>`;
    card.addEventListener('click', ()=> openGame(game));
    gameGrid.appendChild(card);
  });

})();
</script>
